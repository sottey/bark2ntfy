services:
  bark2ntfy:
    build:
      context: .
    image: bark2ntfy:local
    restart: unless-stopped
    environment:
      LISTEN: ":8080"
      NTFY_URL: ${NTFY_URL:?set NTFY_URL in .env}
      NTFY_TOPIC: ${NTFY_TOPIC:?set NTFY_TOPIC in .env}
      NTFY_TOKEN: ${NTFY_TOKEN:?set NTFY_TOKEN in .env}
    ports:
      - "${BARK2NTFY_BIND_ADDRESS:-127.0.0.1}:${BARK2NTFY_HOST_PORT:-8080}:8080"
